name: android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 37
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TvController.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TvController-apk
          path: TvController.apk

      - name: Publish to Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Android APK (latest)
          body: |
            每次 push 自动构建的 Android 遥控器 APK。

            - 打开B站 / 关机待机 / 返回 / 主页 / 音量 / 静音
            - 需与电视在同一局域网
          files: TvController.apk
          prerelease: true
